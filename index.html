<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>RouteRush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="brand-link" href="https://carolinacrespi.github.io/sharper_2025/">
    <span class="badge-emoji">🚚</span> <span class="brand-name" data-i18n="title">ROUTERUSH</span>
  </a>
  <div class="lang">
    <button id="btn-theme" aria-label="Toggle theme" title="☀ / ☾">☾</button>
    <button id="btn-it" aria-pressed="true">IT</button>
    <button id="btn-en" aria-pressed="false">EN</button>
  </div>
</header>

<main class="layout-2col">

  <!-- ======= STAGE: controlli + canvas + feedback ======= -->
  <section class="stage-pane">
    <p class="tagline" data-i18n="tagline">Sfida gli algoritmi, trova la rotta più veloce!</p>

    <div class="controls controls-bar">
      <label><span data-i18n="level_label">Livello:</span>
        <select id="levelSelect" aria-label="Seleziona livello"></select>
      </label>
      <button id="btnUndo" data-i18n="btn_undo">↩ Annulla</button>
      <button id="btnReset" data-i18n="btn_reset">Reset</button>
      <span id="timer"></span>
      <span id="hud"></span>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas" aria-label="mappa del percorso"></canvas>
      <div id="feedback"></div>
    </div>

    <div id="legend" class="legend-outside"></div>

    <p class="tip" data-i18n="howto_1">Clicca le città in ordine, si parte dal pallino giallo.</p>
  </section>

  <!-- ======= SIDE: gli sfidanti, sempre visibili ======= -->
  <aside class="side-pane">
    <h3 data-i18n="side_title">Gli sfidanti</h3>

    <button class="rival-btn" id="btnBF" data-algo="bf">
      <span class="rival-icon rival-bf">🏆</span>
      <span class="rival-info">
        <span class="rival-name" data-i18n="name_bf">Il Perfezionista</span>
        <span class="rival-sub" data-i18n="sub_bf">Brute Force · esatto</span>
      </span>
    </button>

    <button class="rival-btn" id="btnNN" data-algo="nn">
      <span class="rival-icon rival-nn">🎯</span>
      <span class="rival-info">
        <span class="rival-name" data-i18n="name_nn">Il Furbo</span>
        <span class="rival-sub" data-i18n="sub_nn">Nearest Neighbor · euristica</span>
      </span>
    </button>

    <button class="rival-btn" id="btnSA" data-algo="sa">
      <span class="rival-icon rival-sa">🧊</span>
      <span class="rival-info">
        <span class="rival-name" data-i18n="name_sa">Il Freddo</span>
        <span class="rival-sub" data-i18n="sub_sa">Simulated Annealing · single</span>
      </span>
    </button>

    <button class="rival-btn" id="btnACO" data-algo="aco">
      <span class="rival-icon rival-aco">🐜</span>
      <span class="rival-info">
        <span class="rival-name" data-i18n="name_aco">La Colonia</span>
        <span class="rival-sub" data-i18n="sub_aco">Ant Colony · popolazione</span>
      </span>
    </button>

    <button class="rival-btn" id="btnGA" data-algo="ga">
      <span class="rival-icon rival-ga">🧬</span>
      <span class="rival-info">
        <span class="rival-name" data-i18n="name_ga">L'Evoluto</span>
        <span class="rival-sub" data-i18n="sub_ga">Genetic Algorithm · popolazione</span>
      </span>
    </button>

    <div id="algoInfo" class="algo-info"></div>
  </aside>

</main>

<!-- ======= I18N SCRIPT ======= -->
<script>
const TSP_I18N = {
  it: {
    page_title:"RouteRush — trova la rotta più corta",
    title:"ROUTERUSH",
    tagline:"Sfida gli algoritmi, trova la rotta più veloce!",
    howto_1:"Clicca le città in ordine, si parte dal pallino giallo.",
    level_label:"Livello:",
    btn_undo:"↩ Annulla",
    btn_reset:"Reset",
    side_title:"Gli sfidanti",
    name_bf:"Il Perfezionista", sub_bf:"Brute Force · esatto",
    name_nn:"Il Furbo", sub_nn:"Nearest Neighbor · euristica",
    name_sa:"Il Freddo", sub_sa:"Simulated Annealing · single",
    name_aco:"La Colonia", sub_aco:"Ant Colony · popolazione",
    name_ga:"L'Evoluto", sub_ga:"Genetic Algorithm · popolazione",
    info:{
      bf:"<b>Il Perfezionista</b> (Brute Force)<br>Prova tutti i percorsi possibili e sceglie il più corto: perfetto ma lentissimo.",
      nn:"<b>Il Furbo</b> (Nearest Neighbor)<br>Va sempre alla città più vicina: veloce, ma non sempre trova la strada migliore.",
      sa:"<b>Il Freddo</b> (Simulated Annealing)<br>All'inizio esplora anche mosse peggiori, poi \"si raffredda\" e converge sul meglio trovato.",
      aco:"<b>La Colonia</b> (Ant Colony)<br>Le formiche lasciano feromone sulle strade brevi: col tempo la colonia converge lì.",
      ga:"<b>L'Evoluto</b> (Algoritmo Genetico)<br>Una popolazione di percorsi si incrocia e muta: sopravvive il più adatto, generazione dopo generazione."
    },
    feedback_your:"La tua rotta:",
    feedback_challenge:"Riesci a fare di meglio? Sfida gli avversari per confrontarti!",
    feedback_retry:"Riprova",
    feedback_beat:"Hai battuto {algo}!",
    feedback_tie:"Pareggio con {algo}!",
    feedback_lost:"{algo} ha fatto meglio di te.",
    disabled_bf:"Il Perfezionista non regge più di 11 città",
    levels:[
      {v:"10",it:"Facile (10 città)",en:"Easy (10 cities)"},
      {v:"20",it:"Medio (20 città)",en:"Medium (20 cities)"},
      {v:"30",it:"Difficile (30 città)",en:"Hard (30 cities)"},
      {v:"40",it:"Molto difficile (40 città)",en:"Very hard (40 cities)"},
      {v:"50",it:"Estremo (50 città)",en:"Extreme (50 cities)"},
      {v:"60",it:"Estremo+ (60 città)",en:"Extreme+ (60 cities)"}
    ]
  },
  en: {
    page_title:"RouteRush — find the shortest route",
    title:"ROUTERUSH",
    tagline:"Challenge the algorithms, find the fastest route!",
    howto_1:"Click the cities in order, starting from the yellow dot.",
    level_label:"Level:",
    btn_undo:"↩ Undo",
    btn_reset:"Reset",
    side_title:"The rivals",
    name_bf:"The Perfectionist", sub_bf:"Brute Force · exact",
    name_nn:"The Sly One", sub_nn:"Nearest Neighbor · heuristic",
    name_sa:"The Cool One", sub_sa:"Simulated Annealing · single",
    name_aco:"The Colony", sub_aco:"Ant Colony · population",
    name_ga:"The Evolved", sub_ga:"Genetic Algorithm · population",
    info:{
      bf:"<b>The Perfectionist</b> (Brute Force)<br>Tries every possible route and picks the shortest: perfect but very slow.",
      nn:"<b>The Sly One</b> (Nearest Neighbor)<br>Always goes to the closest city: fast, but not always the best route.",
      sa:"<b>The Cool One</b> (Simulated Annealing)<br>At first explores even worse moves, then \"cools down\" and converges on the best found.",
      aco:"<b>The Colony</b> (Ant Colony)<br>Ants leave pheromone on short routes: over time the colony converges there.",
      ga:"<b>The Evolved</b> (Genetic Algorithm)<br>A population of routes crosses and mutates: the fittest survives, generation after generation."
    },
    feedback_your:"Your route:",
    feedback_challenge:"Can you do better? Challenge the rivals to compare!",
    feedback_retry:"Try again",
    feedback_beat:"You beat {algo}!",
    feedback_tie:"Tied with {algo}!",
    feedback_lost:"{algo} did better than you.",
    disabled_bf:"The Perfectionist can't handle more than 11 cities",
    levels:[
      {v:"10",it:"Facile (10 città)",en:"Easy (10 cities)"},
      {v:"20",it:"Medio (20 città)",en:"Medium (20 cities)"},
      {v:"30",it:"Difficile (30 città)",en:"Hard (30 cities)"},
      {v:"40",it:"Molto difficile (40 città)",en:"Very hard (40 cities)"},
      {v:"50",it:"Estremo (50 città)",en:"Extreme (50 cities)"},
      {v:"60",it:"Estremo+ (60 città)",en:"Extreme+ (60 cities)"}
    ]
  }
};

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
let tspLang=localStorage.getItem('tsp_lang')||((navigator.language||'it').toLowerCase().startsWith('en')?'en':'it');

function fillLevels(){
  const sel=$('#levelSelect'); if(!sel) return;
  const cur=sel.value; sel.innerHTML='';
  TSP_I18N.it.levels.forEach(row=>{
    const o=document.createElement('option');
    o.value=row.v; o.textContent=(tspLang==='en'?row.en:row.it);
    sel.appendChild(o);
  });
  if(cur) sel.value=cur;
}

function setLang(lang){
  tspLang=lang; const d=TSP_I18N[lang];
  $$('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n'); if(d[k]) el.innerHTML=d[k];});
  document.title=d.page_title||document.title;
  document.documentElement.lang=lang;
  fillLevels();
  $('#btn-it')?.setAttribute('aria-pressed',lang==='it');
  $('#btn-en')?.setAttribute('aria-pressed',lang==='en');
  localStorage.setItem('tsp_lang',lang);
}

$('#btn-it')?.addEventListener('click',()=>setLang('it'));
$('#btn-en')?.addEventListener('click',()=>setLang('en'));
setLang(tspLang);

// === Theme toggle (dark ☾ / light ☀) ===
let tspTheme = localStorage.getItem('tsp_theme') || 'dark';
function setTheme(theme){
  tspTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  const btn = $('#btn-theme');
  if(btn) btn.textContent = theme === 'dark' ? '☀' : '☾';
  localStorage.setItem('tsp_theme', theme);
  if(typeof draw === 'function') draw();
  if(typeof updateLegend === 'function') updateLegend();
  if(typeof refreshHUD === 'function') refreshHUD();
}
$('#btn-theme')?.addEventListener('click', ()=> setTheme(tspTheme==='dark'?'light':'dark'));
setTheme(tspTheme);
</script>

<script src="main.js"></script>
</body>
</html>
